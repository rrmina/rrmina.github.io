baseURL: "https://rrmina.github.io/"
title: "Rusty Mina"
theme: "PaperMod"
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
# googleAnalytics: "G-R2M9JEHJLQ"
pygmentsUseClasses: true

pagination:
  pagerSize: 20

minify:
  disableXML: true
  minifyOutput: true

params:
  env: "production" # to enable google analytics, opengraph, twitter-cards and schema.
  title: "Rusty Mina"
  description: "Machine Learning Researcher"
  keywords: ["machine learning", "continual learning", "tabular deep learning", "federated learning"]
  author: "Me"
  math: true
  images: ["images/profpic.png"]
  defaultTheme: "light"
  disableThemeToggle: false

  ShowOnlySelectedPubs: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  label:
    text: ""
    icon: "/apple-touch-icon.png"
    iconHeight: ""

  profileMode:
    enabled: false

  homeInfoParams:
    Title: "Rusty Mina"
    Content: |
      I'm a **Machine Learning Researcher** at [GCash](https://www.gcash.com/), a leading fintech company in the Philippines. 
      Prior to joining GCash, I was a graduate student and ML researcher at [KAIST](https://ee.kaist.ac.kr/en/), where I worked on continual learning and fairness in machine learning.
      
      My research focuses on theoretical machine learning algorithms. 
      Recently, I've been interested in developing tabular deep learning models and federated learning algorithms for real-world applications.

      Keywords: *Continual Learning*, *Tabular Deep Learning*, *Federated Learning*
    imageUrl: "images/profpic.png"
    imageTitle: "profile"
    imageWidth: 180
    imageHeight: 180

  socialIcons:
    - name: "email"
      url: "mailto:rustymina[at]gmail.com"
    - name: "github"
      url: "https://github.com/rrmina"
    - name: "googlescholar"
      url: "https://scholar.google.com/citations?user=2pJdTTsAAAAJ"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/rustymina"

  # analytics:
