    - name: "Publications"
      url: "pubs"
      weight: 10
    - name: "Notes"
      url: "post"
      weight: 20
    # - name: "Projects"
    #   url: "projects"
    #   weight: 20

markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: "monokai"
  goldmark:
